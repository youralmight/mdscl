# 仓库来源。分号 ; 分隔，一行一个。字段前后空格会被去掉。
#
#   name ; api_base ; org ; include ; exclude ; family ; mode
#
#   include / exclude   正则，匹配 repo 名。留空 = 不过滤。
#   family              current/public/work，选择路由规则和名单快照。
#   mode                mirror = 只读镜像，每次 fetch + reset --hard 到远端，本地改动丢弃
#                       work   = 自己要动手的，只 clone 新的 + fetch，绝不碰工作区
#
# 名单快照写在 admin/<family>.txt（进 git，用来看有哪些课/哪些作业）。
#
# 为什么用 ; 分隔：
#   - 制表符不行：bash 的 read 会把连续 tab 折叠成一个，中间的空列会消失，
#     exclude 会被当成 include（踩过）。
#   - | 也不行：正则里本来就要用，比如 ^(DSCI|COLX)_ 会被切断。

# 课程材料，只读镜像。排掉以 _yz2000 结尾的个人作业仓库。
mds-2026-27 ; https://github.ubc.ca/api/v3 ; mds-2026-27 ;               ; _yz2000$ ; current ; mirror
ubc-mds     ; https://api.github.com       ; UBC-MDS     ; ^(DSCI|COLX)_ ;          ; public  ; mirror

# 发给我个人的作业仓库。要开分支写作业，所以只 fetch，不动工作区。
assignments ; https://github.ubc.ca/api/v3 ; mds-2026-27 ; _yz2000$      ;          ; work    ; work
