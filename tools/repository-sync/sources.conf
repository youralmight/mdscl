# Repository source registry. Semicolon-delimited:
#   name ; api_base ; org ; include ; exclude ; family ; mode
#
# Each family has one aggregate URL inventory: current.txt, work.txt, or public.txt.
# Every sync discovers all configured sources before conflict and origin checks.
# Include/exclude values are Python regular expressions.
# mirror resets only official mirrors; work fetches without changing the working tree.

# V organization's course materials. Keep its established scope for courses other than 512.
mds-2026-27    ; https://github.ubc.ca/api/v3 ; mds-2026-27    ;                    ; (_yz2000$|^DSCI_512(?:$|_)) ; current ; mirror

# DSCI 512 materials are sourced from CL only. Its org contains student-teaching repos,
# instructor repos, and peer assignments; only the student-teaching convention is current.
mds-cl-2026-27 ; https://github.ubc.ca/api/v3 ; MDS-CL-2026-27 ; ^(DSCI|COLX)_[0-9]{3}_.*_students$ ; ; current ; mirror

# Public materials update only mirrors already retained under official/public.
ubc-mds        ; https://api.github.com       ; UBC-MDS        ; ^(DSCI|COLX)_ ;                ; public  ; mirror

# Personal assignments from both orgs. DSCI 512 work is retained only from CL.
assignments    ; https://github.ubc.ca/api/v3 ; mds-2026-27    ; _yz2000$       ; ^DSCI_512(?:$|_) ; work    ; work
assignments-cl ; https://github.ubc.ca/api/v3 ; MDS-CL-2026-27 ; _yz2000$       ;                ; work    ; work
